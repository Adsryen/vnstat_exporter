name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 在 CentOS 7 容器内构建二进制 (${{ matrix.arch }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            centos:centos7.9.2009 \
            bash -c "
              set -e
              # 换阿里云 CentOS 7 源
              sed -i \
                -e 's|^mirrorlist=|#mirrorlist=|g' \
                -e 's|^#baseurl=http://mirror.centos.org|baseurl=https://mirrors.aliyun.com|g' \
                /etc/yum.repos.d/CentOS-*.repo
              # 直接写入阿里云 epel 源，不走 epel-release 包
              cat > /etc/yum.repos.d/epel.repo << 'EOF'
[epel]
name=Extra Packages for Enterprise Linux 7
baseurl=https://mirrors.aliyun.com/epel/7/x86_64/
enabled=1
gpgcheck=0
EOF
              yum install -y python3 python3-pip
              pip3 install pyinstaller prometheus-client
              cd /build
              pyinstaller --onefile --name vnstat_exporter vnstat_exporter.py
            "
          mv dist/vnstat_exporter dist/vnstat_exporter-linux-${{ matrix.arch }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: vnstat_exporter-linux-${{ matrix.arch }}
          path: dist/vnstat_exporter-linux-${{ matrix.arch }}

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release 并上传二进制
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vnstat_exporter-linux-*
          generate_release_notes: true
