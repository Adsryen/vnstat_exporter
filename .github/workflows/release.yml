name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build amd64
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build binary (amd64)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            centos:centos7.9.2009 \
            bash -c "set -e; sed -i -e 's|^mirrorlist=|#mirrorlist=|g' -e 's|^#baseurl=http://mirror.centos.org|baseurl=https://mirrors.aliyun.com|g' /etc/yum.repos.d/CentOS-*.repo; printf '[epel]\nname=EPEL 7\nbaseurl=https://mirrors.aliyun.com/epel/7/x86_64/\nenabled=1\ngpgcheck=0\n' > /etc/yum.repos.d/epel.repo; yum install -y python3 python3-pip; pip3 install --upgrade pip; pip3 install wheel; pip3 install pyinstaller prometheus-client; cd /build; pyinstaller --onefile --name vnstat_exporter vnstat_exporter.py"
          mv dist/vnstat_exporter dist/vnstat_exporter-linux-amd64

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnstat_exporter-linux-amd64
          path: dist/vnstat_exporter-linux-amd64

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vnstat_exporter-linux-*
          generate_release_notes: true